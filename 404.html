<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Page Not Found - Code Recall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/error.css">
  <link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body class="error-page">
  <main class="error-card">
    <p class="error-brand" aria-label="Code Recall">
      <span class="error-brand-code">CODE:</span><span class="error-brand-recall">RECALL!</span>
    </p>
    <p class="error-code" aria-hidden="true">404</p>
    <h1>Page Not Found</h1>
    <p class="error-message">This page may have moved, or the address may be incorrect. Your learning progress has not been changed.</p>
    <nav class="error-actions" aria-label="Page recovery">
      <a class="error-action primary" href="/">Return Home</a>
      <a class="error-action" href="/dashboard">Go to Dashboard</a>
    </nav>
  </main>
</body>
</html>
