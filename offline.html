<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Offline - Code Recall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: linear-gradient(135deg, #0b0f2a, #2b1e5a);
      color: #fff;
      font-family: 'Poppins', sans-serif;
    }
    main {
      width: min(620px, 100%);
      padding: 30px;
      border-radius: 22px;
      background: rgba(58, 37, 117, 0.92);
      border: 1px solid rgba(255,255,255,0.08);
      box-shadow: 0 18px 46px rgba(4, 6, 24, 0.24);
    }
    .logo {
      margin: 0 0 22px;
      color: #ff8a2a;
      font-family: 'Press Start 2P', cursive;
      font-size: 15px;
      line-height: 1.6;
      text-shadow: 0 0 10px rgba(255,138,42,0.55);
    }
    h1 {
      margin: 0 0 10px;
      font-size: clamp(30px, 7vw, 46px);
      line-height: 1.05;
    }
    p {
      margin: 0 0 18px;
      color: rgba(255,255,255,0.82);
      line-height: 1.7;
    }
    a, button {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      background: linear-gradient(135deg, #ff2e97, #00d4ff);
      color: #fff;
      cursor: pointer;
      font: 700 14px 'Poppins', sans-serif;
      text-decoration: none;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
  </style>
</head>
<body>
  <main>
    <p class="logo">CODE: RECALL!</p>
    <h1>You are offline</h1>
    <p>
      Some Code Recall pages can still open if they were cached from a previous visit.
      Login, messages, admin tools, and progress sync need an internet connection.
    </p>
    <div class="actions">
      <button type="button" onclick="window.location.reload()">Try Again</button>
      <a href="dashboard.html">Open Dashboard</a>
    </div>
  </main>
</body>
</html>
