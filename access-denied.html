<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Access Denied | Code Recall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <style>
    :root {
      --bg:
        radial-gradient(circle at 18% 18%, rgba(0, 229, 255, 0.15), transparent 25%),
        radial-gradient(circle at 82% 22%, rgba(255, 46, 151, 0.18), transparent 28%),
        linear-gradient(145deg, #081124 0%, #191641 44%, #271e5b 100%);
      --card: rgba(255, 255, 255, 0.07);
      --panel: rgba(8, 14, 31, 0.38);
      --line: rgba(255, 255, 255, 0.12);
      --text: #ffffff;
      --muted: rgba(255, 255, 255, 0.78);
      --accent: #00e5ff;
      --primary: #ff2e97;
      --shadow: 0 24px 70px rgba(4, 6, 24, 0.34);
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      box-sizing: border-box;
      background: var(--bg);
      color: var(--text);
      font-family: 'Poppins', sans-serif;
      transition: background 0.3s ease, color 0.3s ease;
    }

    main {
      position: relative;
      width: min(720px, 100%);
      padding: 34px;
      border-radius: 28px;
      background: var(--card);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    main::before {
      content: "";
      position: absolute;
      inset: 1px 1px auto;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 24px;
    }

    .logo {
      margin: 0;
      color: #ff8a2a;
      font-family: 'Press Start 2P', cursive;
      font-size: 15px;
      line-height: 1.6;
      text-shadow: 0 0 10px rgba(255, 138, 42, 0.55);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: var(--accent);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(30px, 7vw, 46px);
      line-height: 1.08;
    }

    p {
      margin: 0 0 18px;
      color: var(--muted);
      line-height: 1.7;
    }

    .details {
      margin: 22px 0;
      padding: 20px;
      border-radius: 18px;
      background: var(--panel);
      border: 1px solid var(--line);
      backdrop-filter: blur(14px);
    }

    .details strong {
      display: block;
      margin-bottom: 6px;
      color: var(--text);
    }

    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    a {
      min-height: 44px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 16px;
      color: #fff;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      transition: transform 0.22s ease, box-shadow 0.22s ease, background 0.22s ease;
    }

    a:hover {
      transform: translateY(-2px);
    }

    .primary-link {
      background: linear-gradient(135deg, var(--primary), #ff4db8);
      box-shadow: 0 14px 28px rgba(255, 46, 151, 0.2);
    }

    .secondary-link {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--line);
    }

    .theme-toggle {
      position: fixed;
      right: 22px;
      bottom: 22px;
      width: 52px;
      height: 52px;
      border: 1px solid var(--line);
      border-radius: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, rgba(255, 46, 151, 0.92), rgba(0, 216, 255, 0.92));
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 18px 34px rgba(0, 0, 0, 0.22);
      backdrop-filter: blur(14px);
      transition: transform 0.22s ease, box-shadow 0.22s ease;
    }

    .theme-toggle:hover {
      transform: translateY(-2px);
      box-shadow: 0 22px 42px rgba(0, 0, 0, 0.28);
    }

    body.light-mode {
      --bg:
        radial-gradient(circle at 18% 18%, rgba(0, 169, 199, 0.18), transparent 25%),
        radial-gradient(circle at 82% 22%, rgba(255, 46, 151, 0.12), transparent 28%),
        linear-gradient(145deg, #f7f9ff 0%, #edf3ff 48%, #e8ecff 100%);
      --card: rgba(255, 255, 255, 0.72);
      --panel: rgba(255, 255, 255, 0.58);
      --line: rgba(26, 17, 64, 0.1);
      --text: #1a1140;
      --muted: rgba(26, 17, 64, 0.74);
      --accent: #0077ff;
      --shadow: 0 24px 60px rgba(31, 39, 84, 0.14);
    }

    body.light-mode .logo {
      text-shadow: none;
    }

    body.light-mode .secondary-link {
      color: #1a1140;
      background: rgba(26, 17, 64, 0.06);
    }

    @media (max-width: 560px) {
      body {
        padding: 16px;
      }

      main {
        padding: 24px;
      }

      .brand-row {
        align-items: flex-start;
        flex-direction: column;
      }

      a {
        width: 100%;
        box-sizing: border-box;
      }

      .theme-toggle {
        right: 16px;
        bottom: 16px;
      }
    }
  </style>
</head>
<body>
  <main>
    <div class="brand-row">
      <p class="logo">CODE: RECALL!</p>
    </div>
    <p class="eyebrow">Protected Area</p>
    <h1>Access Denied</h1>
    <p id="accessDeniedMessage">
      This page is restricted to authorized Code Recall accounts.
    </p>
    <div class="details">
      <strong id="accessDeniedTitle">Role check did not pass</strong>
      <p id="accessDeniedDetail">
        Sign in with the correct account or return to your dashboard.
      </p>
    </div>
    <div class="actions">
      <a class="primary-link" href="dashboard.html">Open Dashboard</a>
      <a class="secondary-link" href="auth.html?mode=switch" id="switchAccountLink">Switch Account</a>
    </div>
  </main>

  <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle dark and light mode">
    <span id="themeIcon">&#127769;</span>
  </button>

  <script>
    const savedTheme = localStorage.getItem("theme");
    if (savedTheme === "light") {
      document.body.classList.add("light-mode");
    }

    function syncThemeIcon() {
      const icon = document.getElementById("themeIcon");
      if (icon) icon.textContent = document.body.classList.contains("light-mode") ? "\u2600\uFE0F" : "\uD83C\uDF19";
    }

    window.toggleTheme = function() {
      document.body.classList.toggle("light-mode");
      localStorage.setItem("theme", document.body.classList.contains("light-mode") ? "light" : "dark");
      syncThemeIcon();
    };

    syncThemeIcon();

    document.getElementById("switchAccountLink")?.addEventListener("click", (event) => {
      event.preventDefault();
      sessionStorage.setItem("code_recall_switch_account", "1");
      window.location.href = "auth.html?mode=switch";
    });

    const params = new URLSearchParams(window.location.search);
    const area = params.get("area") || "protected";
    const role = params.get("role") || "unknown";

    const labels = {
      admin: "Admin Dashboard",
      "super-admin": "Super Admin Dashboard",
      protected: "Protected Area"
    };

    const roleLabels = {
      guest: "Guest",
      user: "Learner",
      admin: "Admin",
      super_admin: "Super Admin",
      unknown: "Unknown"
    };

    const title = labels[area] || labels.protected;
    const roleLabel = roleLabels[role] || roleLabels.unknown;

    document.getElementById("accessDeniedMessage").textContent =
      `${title} is available only to accounts with the required role and completed security checks.`;
    document.getElementById("accessDeniedTitle").textContent =
      `Detected role: ${roleLabel}`;
    document.getElementById("accessDeniedDetail").textContent =
      "If this account should have access, ask a super admin to verify the role grant and then sign in again.";
  </script>
</body>
</html>
