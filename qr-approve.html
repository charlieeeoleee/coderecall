<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Code: Recall - QR Login Approval</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/qr-approve.css">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <main class="approval-shell">
    <section class="approval-card">
      <div class="logo">CODE: RECALL!</div>
      <span class="eyebrow">QR-Assisted Login</span>
      <h1 id="approvalTitle">Approve Desktop Sign-In</h1>
      <p id="approvalCopy">Confirm that you are trying to sign in on another device.</p>

      <div id="approvalTerminal" class="approval-terminal" role="status" aria-live="polite" hidden>
        <span id="approvalTerminalIcon" class="approval-terminal-icon" aria-hidden="true"></span>
        <div>
          <h2 id="approvalTerminalTitle"></h2>
          <p id="approvalTerminalMessage"></p>
        </div>
      </div>

      <div class="approval-panel">
        <span id="approvalAccountLabel" class="approval-account-label">Current learner</span>
        <strong id="approvalAccount">Checking account...</strong>
        <span id="approvalContext"></span>
        <span id="approvalStatus">Preparing secure approval request.</span>
      </div>

      <form id="matchingCodeForm" class="phone-password-form" hidden>
        <label for="matchingCode">Three-digit code shown on your computer</label>
        <input id="matchingCode" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="3" pattern="[0-9]{3}" placeholder="000">
        <button type="submit">Verify Matching Code</button>
      </form>

      <form id="phonePasswordForm" class="phone-password-form" hidden>
        <label for="phoneEmail">Email</label>
        <input id="phoneEmail" type="email" autocomplete="email" placeholder="Email">
        <label for="phonePassword">Password</label>
        <input id="phonePassword" type="password" autocomplete="current-password" placeholder="Password">
        <button type="submit" class="secondary">Sign In with Email</button>
      </form>

      <div class="approval-actions">
        <button id="approveQrBtn" type="button">Approve Login</button>
        <button id="cancelQrBtn" type="button" class="secondary">Deny Login</button>
        <button id="phoneSwitchAccountBtn" type="button" class="secondary" hidden>Switch Account</button>
        <button id="phoneGoogleBtn" type="button" class="secondary">Sign In with Google</button>
        <button id="phonePasswordToggleBtn" type="button" class="secondary">Use Email Instead</button>
      </div>

      <p id="approvalNote" class="approval-note">Only approve this when the QR code is visible on your own computer.</p>
    </section>
  </main>

  <script src="scripts/firebase-config.runtime.js?v=20260609c"></script>
  <script type="module" src="scripts/qr-approve.js?v=20260811b"></script>
</body>
</html>
